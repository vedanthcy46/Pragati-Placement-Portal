services:
  - type: web
    name: pragati-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://your-frontend.netlify.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: RESEND_API_KEY
        value: 4a9b8c1e-5c3d-4f2e-9b6a-7d8e9f0a1b2c
      - key: POSTGRESQL_URI
        fromDatabase:
          name: pragati-db
          property: connectionString

databases:
  - name: pragati-db
    plan: free
