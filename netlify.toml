# Netlify configuration for the frontend (Vite + React)
# Deploy settings: Base directory = repo root, or connect the "frontend" folder via Netlify UI.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # IMPORTANT: Replace with your actual Render backend URL after the first deploy.
  # It must end with /api because services like companyService.js append /v1/company to it.
  VITE_API_URL = "https://pragati-backend.onrender.com/api"

# SPA fallback: serve index.html for all client-side routes.
# No "force" so real static assets (JS/CSS/images) are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term caching for hashed build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
