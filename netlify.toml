# Netlify configuration for the frontend (Vite + React)
# NOTE: No "base" here on purpose - all paths are relative to the repo root,
# which avoids empty-publish-folder issues.

[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"
  # IMPORTANT: Replace with your actual Render backend URL after the first deploy.
  # It must end with /api because services like companyService.js append /v1/company to it.
  VITE_API_URL = "https://pragati-placement-portal.onrender.com/api"

# SPA fallback: serve index.html for all client-side routes.
# No "force" so real static assets (JS/CSS/images) are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term caching for hashed build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
